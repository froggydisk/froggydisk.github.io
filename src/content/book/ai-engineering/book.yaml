title: 개발자를 위한 AI 엔지니어링
subtitle: 모델 호출에서 신뢰할 수 있는 서비스까지
description: >-
  사전 학습 모델을 활용해 문서에 근거한 답변과 업무 도구 실행을 제공하는 서비스를 만든다.
  모델 선택과 API 호출에서 시작해 컨텍스트, 검색, 에이전트, 평가, 보안과 운영까지
  구현 원리와 실패 조건, 설계 대안을 연결해 설명한다.
